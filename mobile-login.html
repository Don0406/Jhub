<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Hub | Staff Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #000; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 390px; height: 100vh; background-color: var(--bg-primary); display: flex; flex-direction: column; justify-content: center; padding: 32px; position: relative; }
        .touch-input { padding: 16px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <h1 class="heading-xl" style="text-align: center; margin-bottom: 8px;">J-Hub Staff</h1>
        <p class="body-text" style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">Field Operations Portal</p>
        
        <form id="mobile-login-form">
            <div style="margin-bottom: 24px;">
                <label class="label-text">Staff Email</label>
                <input type="email" class="input-field touch-input" placeholder="staff@j-hub.com" required style="margin-top: 8px;">
            </div>
            
            <div style="margin-bottom: 32px;">
                <label class="label-text">Password</label>
                <input type="password" class="input-field touch-input" placeholder="••••••••" required style="margin-top: 8px;">
            </div>
            
            <button type="submit" class="btn btn-primary touch-input" style="width: 100%;">Secure Log In</button>
        </form>
    </div>
<script src="app.js?v=16"></script>
</body>
</html>
