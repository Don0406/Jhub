<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Hub | Mobile Manifest</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #000; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 390px; height: 100vh; background-color: var(--bg-primary); overflow-y: auto; position: relative; }
        .mobile-header { background-color: var(--bg-secondary); padding: 24px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .passenger-card { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .passenger-flagged { border-left: 4px solid var(--status-nogo); background-color: rgba(239, 68, 68, 0.05); cursor: pointer; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--status-go); }
        input:checked + .slider:before { transform: translateX(22px); }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header class="mobile-header">
            <h2 class="heading-lg" style="margin-bottom: 4px;">Sagada Retreat</h2>
            <p class="body-sm">Oct 12 • Pickup: Trinoma, Quezon City</p>
        </header>

        <div class="passenger-card">
            <div>
                <p class="heading-md" style="margin-bottom: 4px;">Juan Dela Cruz</p>
                <p class="label-text">Trinoma • Seat 1A</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" class="checkin-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="passenger-card passenger-flagged" id="flagged-passenger">
            <div>
                <p class="heading-md" style="margin-bottom: 4px; color: var(--status-nogo);">Maria Clara</p>
                <p class="label-text" style="color: var(--status-nogo);">Trinoma • Seat 1B</p>
                <p class="body-sm" style="color: var(--status-nogo); margin-top: 4px; font-weight: 600;">ACTION REQUIRED: Unsigned Waiver</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" disabled>
                <span class="slider"></span>
            </label>
        </div>
    </div>
<script src="app.js?v=16"></script>
</body>
</html>
