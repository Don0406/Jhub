<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>J-Hub | Agency Catalog</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; height: 100vh; overflow: hidden; }
        .sidebar { background-color: var(--bg-secondary); padding: 24px; border-right: 1px solid var(--border-color); }
        .main-content { padding: 32px; overflow-y: auto; background-color: var(--bg-primary); }
        .filter-bar { display: flex; gap: 16px; margin-bottom: 24px; background-color: var(--bg-secondary); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
        .data-table { width: 100%; border-collapse: collapse; background-color: var(--bg-secondary); border-radius: 8px; overflow: hidden; }
        .data-table th, .data-table td { text-align: left; padding: 16px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background-color: rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar" style="display: flex; flex-direction: column;">
            <div class="brand-logo" style="margin-bottom: 32px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span class="logo-text">J-Hub <span style="font-size: 14px; font-weight: 500; color: var(--text-muted); vertical-align: middle; margin-left: 4px;">Agency</span></span>
            </div>
        
            <nav style="display: flex; flex-direction: column; gap: 16px; height: 100%;">
                <a href="agency-dashboard.html" class="body-text" style="color: var(--text-muted); text-decoration: none;">Dashboard</a>
                <a href="agency-catalog.html" class="body-text" style="color: var(--text-primary); font-weight: 600;">Tour Catalog</a>
                <a href="client-management.html" class="body-text" style="color: var(--text-muted); text-decoration: none;">Clients</a>
                <a href="commission-tracker.html" class="body-text" style="color: var(--text-muted); text-decoration: none;">Commissions</a>
                
                <!-- Consistent Logout Button pinned to bottom left -->
                <a href="login.html" id="logout-btn" class="body-text" style="color: var(--status-nogo); text-decoration: none; font-weight: 500; margin-top: auto;">Log Out</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="heading-xl" style="margin-bottom: 24px;">Operator Inventory</h1>

            <!-- UPDATED FILTER BAR WITH IDs -->
            <div class="filter-bar">
                <input type="text" id="agency-search-input" class="input-field" placeholder="Search destinations..." style="max-width: 300px;">
                <select id="agency-date-filter" class="input-field" style="max-width: 200px;">
                    <option value="All Dates">All Dates</option>
                    <option value="Oct">October (Next Quarter)</option>
                    <option value="Nov">November (Peak Season)</option>
                </select>
                <button id="agency-filter-btn" class="btn btn-secondary">Search</button>
            </div>

            <!-- UPDATED TABLE WITH IDs AND BUTTON DATA ATTRIBUTES -->
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="label-text">TOUR</th>
                        <th class="label-text">DATE</th>
                        <th class="label-text">PRICE (PER PAX)</th>
                        <th class="label-text">LIVE AVAILABILITY</th>
                        <th class="label-text">ACTION</th>
                    </tr>
                </thead>
                <tbody id="agency-catalog-body">
                    <tr>
                        <td class="heading-md">Sagada Weekend Retreat</td>
                        <td class="body-text">Oct 12 - Oct 14, 2026</td>
                        <td class="body-text">₱3,500</td>
                        <td><span style="color: var(--status-watch); font-weight: 600;">5 Seats Left</span></td>
                        <td>
                            <!-- Secret Agency Data Added Here -->
                            <button class="btn btn-primary book-client-btn" data-id="sagada" data-tour="Sagada Weekend Retreat" data-price="3500" style="padding: 6px 12px; font-size: 12px;">Book for Client</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="heading-md">Mt. Pulag Sea of Clouds</td>
                        <td class="body-text">Nov 07 - Nov 08, 2026</td>
                        <td class="body-text">₱2,800</td>
                        <td><span style="color: var(--status-go); font-weight: 600;">12 Seats Left</span></td>
                        <td>
                            <!-- Secret Agency Data Added Here -->
                            <button class="btn btn-primary book-client-btn" data-id="pulag" data-tour="Mt. Pulag Sea of Clouds" data-price="2800" style="padding: 6px 12px; font-size: 12px;">Book for Client</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

<script src="app.js"></script>
</body>
</html>
