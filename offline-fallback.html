<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Hub | Offline Manifest</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: #000; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 390px; height: 100vh; background-color: var(--bg-primary); overflow-y: auto; position: relative; }
        .mobile-header { background-color: var(--bg-secondary); padding: 24px 20px; border-bottom: 1px solid var(--border-color); }
        .offline-banner { background-color: var(--status-watch); color: #000; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; position: sticky; top: 0; z-index: 20; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .passenger-card { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="offline-banner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            Offline Mode — showing last cached data
        </div>

        <header class="mobile-header">
            <h2 class="heading-lg" style="margin-bottom: 4px;">Sagada Retreat</h2>
            <p class="body-sm">Oct 12 • Pickup: Trinoma</p>
        </header>

        <div class="passenger-card">
            <div>
                <p class="heading-md" style="margin-bottom: 4px;">Juan Dela Cruz</p>
                <p class="label-text">Seat 1A</p>
                <p class="body-sm" style="color: var(--status-watch); margin-top: 4px;">Sync queued...</p>
            </div>
            <div>
                <span class="badge" style="background-color: rgba(34, 197, 94, 0.2); color: var(--status-go);">Checked In</span>
            </div>
        </div>
    </div>
<script src="app.js?v=16"></script>
</body>
</html>
