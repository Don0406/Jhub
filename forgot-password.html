<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>J-Hub | Reset Password</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-primary);
        }
        .auth-card {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="heading-lg" style="text-align: center; margin-bottom: 8px;">Reset Password</h1>
            <p class="body-text" style="text-align: center; color: var(--text-muted); margin-bottom: 32px;">Enter your email and we'll send you a link to reset your password.</p>
            
            <form id="forgot-password-form">
                <div style="margin-bottom: 24px;">
                    <label class="label-text">Email Address</label>
                    <input type="email" class="input-field" placeholder="name@example.com" required style="margin-top: 8px;">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Send Reset Link</button>
            </form>
            
            <p class="body-text" style="text-align: center;">
                <a href="login.html" style="color: var(--accent-blue); text-decoration: none; font-weight: 500;">Back to Login</a>
            </p>
        </div>
    </div>

<script src="app.js?v=11"></script>
</body>
</html>
